<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Ship Family Chat - Real-Time eChat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
        .bubble-sent { border-bottom-right-radius: 2px !important; }
        .bubble-received { border-bottom-left-radius: 2px !important; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Main Container -->
    <div id="app" class="flex h-full w-full relative">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col h-full z-20 transition-all duration-300 absolute md:relative">
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-black text-white">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-xl shadow-md">
                        <i class="fa-solid font-bold text-lg">e</i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight text-white leading-none">Ship Ship Family Chat</h1>
                        <span class="text-xs text-slate-400 font-medium">Real-Time Firebase Chat</span>
                    </div>
                </div>
                <div class="flex items-center space-x-1">
                    <button id="themeToggle" class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Toggle Theme">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <button id="closeSidebarBtn" class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Current User Quick Profile Switcher -->
            <div class="px-4 py-3 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-white">
                <div class="flex items-center space-x-3 min-w-0">
                    <div class="relative shrink-0">
                        <img id="userAvatar" src="" class="w-9 h-9 rounded-full object-cover ring-2 ring-brand-500/30">
                        <span class="w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-900 rounded-full absolute bottom-0 right-0"></span>
                    </div>
                    <div class="min-w-0">
                        <p id="userNameDisplay" class="text-sm font-semibold leading-tight text-white truncate">Loading...</p>
                        <p id="userRoleDisplay" class="text-xs text-slate-400 truncate">Online</p>
                    </div>
                </div>
                <!-- Dropdown / Switch Account -->
                <button onclick="openUserSwitchModal()" class="text-xs bg-brand-600 hover:bg-brand-700 px-2.5 py-1.5 rounded-lg text-white font-medium transition shrink-0">
                    Switch User
                </button>
            </div>

            <!-- Inbox Search Bar -->
            <div class="p-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search contacts (Faizan, Nadeem, etc.)..." class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 border border-transparent dark:border-slate-700 transition">
                </div>
            </div>

            <!-- Contacts Inbox Header -->
            <div class="px-4 py-2 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <span>Family Inbox</span>
                <span id="syncIndicator" class="text-[10px] text-emerald-500 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Live Sync
                </span>
            </div>

            <!-- Contact List -->
            <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50">
                <!-- Loaded Dynamically -->
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900 relative">

            <!-- Chat Header Bar -->
            <header id="chatHeader" class="px-4 py-3 bg-black text-white border-b border-slate-800 flex items-center justify-between z-10 shadow-md">
                <div class="flex items-center space-x-3">
                    <button id="openSidebarBtn" class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="relative">
                        <img id="activeAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                        <span id="activeStatusDot" class="w-3 h-3 bg-emerald-500 border-2 border-black rounded-full absolute bottom-0 right-0"></span>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h2 id="activeName" class="font-bold text-white leading-tight">Select a Chat</h2>
                            <span id="activeBadge" class="hidden px-2 py-0.5 text-[10px] font-semibold bg-brand-600 text-white rounded-full">Admin</span>
                        </div>
                        <p id="activeStatusText" class="text-xs text-slate-400">Online</p>
                    </div>
                </div>

                <!-- Action Items -->
                <div class="flex items-center space-x-1">
                    <button onclick="triggerCall('voice')" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Voice Call">
                        <i class="fa-solid fa-phone"></i>
                    </button>
                    <button onclick="triggerCall('video')" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Video Call">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <div class="h-5 w-px bg-slate-800 mx-1"></div>
                    <button onclick="toggleChatSearch()" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Filter Chat">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <button onclick="clearCurrentChat()" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Clear Chat History">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- In-Chat Search Bar -->
            <div id="inChatSearch" class="hidden px-4 py-2 bg-indigo-50 dark:bg-slate-800 border-b border-indigo-100 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center flex-1 space-x-2">
                    <i class="fa-solid fa-filter text-brand-500 text-sm"></i>
                    <input type="text" id="inChatSearchInput" oninput="filterMessages(this.value)" placeholder="Filter messages in this conversation..." class="bg-transparent text-sm w-full focus:outline-none text-slate-800 dark:text-slate-100">
                </div>
                <button onclick="toggleChatSearch()" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-semibold px-2 py-1">Close</button>
            </div>

            <!-- Messages Stream -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Live Firestore Messages -->
            </div>

            <!-- Attachment Preview Bar -->
            <div id="attachmentPreviewBar" class="hidden px-4 py-2 bg-slate-100 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div id="previewIcon" class="w-10 h-10 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 flex items-center justify-center font-bold text-sm">
                        <i class="fa-solid fa-file"></i>
                    </div>
                    <div class="truncate">
                        <p id="previewFileName" class="text-xs font-semibold truncate text-slate-800 dark:text-slate-200">file.pdf</p>
                        <p id="previewFileSize" class="text-[10px] text-slate-500 dark:text-slate-400">1.2 MB</p>
                    </div>
                </div>
                <button onclick="removeAttachment()" class="p-1 text-slate-400 hover:text-rose-500 transition">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>

            <!-- Emoji Picker Popover -->
            <div id="emojiPicker" class="hidden absolute bottom-20 left-4 z-30 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl p-3 w-72">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Emojis</div>
                <div class="grid grid-cols-6 gap-2 text-xl max-h-48 overflow-y-auto p-1">
                    <button onclick="insertEmoji('😀')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😀</button>
                    <button onclick="insertEmoji('😂')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😂</button>
                    <button onclick="insertEmoji('😍')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😍</button>
                    <button onclick="insertEmoji('🔥')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🔥</button>
                    <button onclick="insertEmoji('👍')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">👍</button>
                    <button onclick="insertEmoji('🎉')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🎉</button>
                    <button onclick="insertEmoji('❤️')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">❤️</button>
                    <button onclick="insertEmoji('🚀')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🚀</button>
                    <button onclick="insertEmoji('😎')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😎</button>
                    <button onclick="insertEmoji('🙌')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🙌</button>
                    <button onclick="insertEmoji('💡')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">💡</button>
                    <button onclick="insertEmoji('✨')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">✨</button>
                </div>
            </div>

            <!-- Footer Message Form -->
            <footer class="p-3 sm:p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 z-10">
                <form id="messageForm" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2">
                    <label class="p-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer transition">
                        <i class="fa-solid fa-paperclip text-lg"></i>
                        <input type="file" id="fileInput" onchange="handleFileSelect(event)" class="hidden">
                    </label>

                    <button type="button" onclick="toggleEmojiPicker()" class="p-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>

                    <div class="flex-1 relative">
                        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" class="w-full py-3 pl-4 pr-10 bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 border border-transparent dark:border-slate-700 transition">
                    </div>

                    <button type="button" onclick="sendVoiceSim()" class="p-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Voice Message Simulation">
                        <i class="fa-solid fa-microphone text-lg"></i>
                    </button>

                    <button type="submit" class="p-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-medium shadow-md shadow-brand-500/20 active:scale-95 transition flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- User Switcher Modal -->
    <div id="userSwitchModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">Switch Active Family User</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Select which family member you are logging in as:</p>
                </div>
                <button onclick="closeUserSwitchModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="userOptionsContainer" class="space-y-3">
                <!-- Dynamic choices populated in JS -->
            </div>
        </div>
    </div>

    <!-- Simulated Call Modal -->
    <div id="callModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 text-white rounded-3xl p-8 max-w-sm w-full flex flex-col items-center text-center shadow-2xl border border-slate-800">
            <div class="relative mb-6">
                <img id="callAvatar" src="" class="w-24 h-24 rounded-full object-cover ring-4 ring-brand-500/30">
                <div class="absolute inset-0 rounded-full animate-ping ring-2 ring-brand-500 opacity-40"></div>
            </div>
            <h3 id="callName" class="text-xl font-bold">Calling...</h3>
            <p id="callStatus" class="text-sm text-slate-400 mt-1">Connecting call...</p>
            <div class="flex items-center space-x-6 mt-8">
                <button onclick="endCall()" class="w-14 h-14 rounded-full bg-rose-600 hover:bg-rose-700 flex items-center justify-center text-xl shadow-lg transition transform hover:scale-105">
                    <i class="fa-solid fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'echat-ship-ship-family';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-api-key",
                authDomain: "demo-project.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo-project.appspot.com",
                messagingSenderId: "1234567890",
                appId: "1:1234567890:web:123456"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Pre-defined Family Users
        const familyUsers = [
            {
                id: 'faizan_abbasi',
                name: 'Muhammad Faizan Abbasi (Admin)',
                role: 'Admin',
                status: 'online',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80'
            },
            {
                id: 'nadeem_rizvi',
                name: 'Nadeem Rizvi',
                role: 'Family Member',
                status: 'online',
                avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80'
            },
            {
                id: 'mudassir_hussain',
                name: 'Mudassir Hussain',
                role: 'Family Member',
                status: 'online',
                avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80'
            },
            {
                id: 'shawal_abbasi',
                name: 'Shawal Abbasi',
                role: 'Family Member',
                status: 'online',
                avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&q=80'
            }
        ];

        // State Variables
        let currentUser = familyUsers[0];
        let activeTargetUser = familyUsers[1];
        let liveMessages = [];
        let unsubscribeSnapshot = null;
        let currentAttachment = null;
        let searchFilterText = '';

        // Initialize Authentication & Listeners
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn("Auth fallback mode active:", err);
            }

            setupTheme();
            setupEventListeners();
            updateCurrentProfileUI();
            renderUserSwitchModalChoices();
            renderContactList();
            setActiveTarget(familyUsers[1].id);
            subscribeToFirebaseMessages();
        }

        // Determine conversation document path
        function getConversationDocId(user1Id, user2Id) {
            return [user1Id, user2Id].sort().join('___');
        }

        // Firestore Realtime Subscription
        function subscribeToFirebaseMessages() {
            if (!auth.currentUser && typeof __initial_auth_token !== 'undefined') return;

            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const convId = getConversationDocId(currentUser.id, activeTargetUser.id);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chats', convId);

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().messages) {
                    liveMessages = docSnap.data().messages;
                } else {
                    liveMessages = [];
                }
                renderMessages();
                renderContactList();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
            });
        }

        // Render Sidebar Contacts
        function renderContactList() {
            const listContainer = document.getElementById('contactList');
            listContainer.innerHTML = '';

            const otherUsers = familyUsers.filter(u => u.id !== currentUser.id);
            const filtered = otherUsers.filter(u => u.name.toLowerCase().includes(searchFilterText.toLowerCase()));

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No contacts found</div>`;
                return;
            }

            filtered.forEach(user => {
                const isActive = user.id === activeTargetUser.id;
                const html = `
                    <div onclick="setActiveTarget('${user.id}')" class="p-3 flex items-center space-x-3 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700/50 transition ${isActive ? 'bg-indigo-50/70 dark:bg-slate-700/70 border-r-4 border-brand-600' : ''}">
                        <div class="relative shrink-0">
                            <img src="${user.avatar}" class="w-12 h-12 rounded-full object-cover">
                            <span class="w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full absolute bottom-0 right-0"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="text-sm font-semibold truncate text-slate-900 dark:text-slate-100">${user.name}</h3>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${user.role}</p>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        // Set Active DM Target
        window.setActiveTarget = function(targetId) {
            const found = familyUsers.find(u => u.id === targetId);
            if (!found) return;

            activeTargetUser = found;

            document.getElementById('activeName').innerText = activeTargetUser.name;
            document.getElementById('activeAvatar').src = activeTargetUser.avatar;
            document.getElementById('activeStatusText').innerText = `${activeTargetUser.role} • Online`;

            const badge = document.getElementById('activeBadge');
            if (activeTargetUser.role === 'Admin') badge.classList.remove('hidden');
            else badge.classList.add('hidden');

            renderContactList();
            subscribeToFirebaseMessages();

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        };

        // Render Conversation Bubble History
        function renderMessages(filterQuery = '') {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const list = filterQuery 
                ? liveMessages.filter(m => m.text && m.text.toLowerCase().includes(filterQuery.toLowerCase()))
                : liveMessages;

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400">
                        <i class="fa-regular fa-comments text-4xl mb-2 opacity-50"></i>
                        <p class="text-sm">No live messages yet between ${currentUser.name.split(' ')[0]} and ${activeTargetUser.name.split(' ')[0]}. Say hello!</p>
                    </div>`;
                return;
            }

            list.forEach(msg => {
                const isMe = msg.senderId === currentUser.id;
                
                let attachmentMarkup = '';
                if (msg.attachment) {
                    if (msg.attachment.type === 'image') {
                        attachmentMarkup = `<img src="${msg.attachment.url}" class="rounded-xl max-w-xs mb-2 border border-slate-200 dark:border-slate-700 shadow-sm">`;
                    } else if (msg.attachment.type === 'audio') {
                        attachmentMarkup = `
                            <div class="flex items-center space-x-3 bg-indigo-900/10 dark:bg-slate-900/40 p-2.5 rounded-xl mb-2 min-w-[200px]">
                                <button type="button" onclick="this.querySelector('i').classList.toggle('fa-pause'); this.querySelector('i').classList.toggle('fa-play');" class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                                <div class="flex-1">
                                    <div class="h-1.5 w-full bg-slate-300 dark:bg-slate-600 rounded-full overflow-hidden">
                                        <div class="h-full bg-brand-500 w-1/3"></div>
                                    </div>
                                </div>
                                <span class="text-[10px] text-slate-500">0:12</span>
                            </div>`;
                    } else {
                        attachmentMarkup = `
                            <div class="flex items-center space-x-2 bg-slate-100 dark:bg-slate-700 p-2 rounded-lg mb-2">
                                <i class="fa-solid fa-file-pdf text-rose-500 text-lg"></i>
                                <span class="text-xs font-medium truncate">${escapeHTML(msg.attachment.name)}</span>
                            </div>`;
                    }
                }

                const msgHtml = `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[75%] sm:max-w-[65%] flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <div class="px-4 py-2.5 rounded-2xl text-sm shadow-sm ${
                                isMe 
                                    ? 'bg-brand-600 text-white bubble-sent' 
                                    : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200/80 dark:border-slate-700/80 bubble-received'
                            }">
                                ${attachmentMarkup}
                                ${msg.text ? `<p class="leading-relaxed break-words">${escapeHTML(msg.text)}</p>` : ''}
                            </div>
                            <span class="text-[10px] text-slate-400 mt-1 px-1 flex items-center space-x-1">
                                <span>${msg.time}</span>
                                ${isMe ? '<i class="fa-solid fa-check-double text-brand-500 text-[10px]"></i>' : ''}
                            </span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', msgHtml);
            });

            container.scrollTop = container.scrollHeight;
        }

        // Send Message to Firestore
        window.handleSendMessage = async function(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !currentAttachment) return;

            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newMsg = {
                id: Date.now(),
                senderId: currentUser.id,
                senderName: currentUser.name,
                text: text,
                time: timeNow,
                attachment: currentAttachment ? { ...currentAttachment } : null
            };

            const updatedMessages = [...liveMessages, newMsg];
            const convId = getConversationDocId(currentUser.id, activeTargetUser.id);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chats', convId);

            input.value = '';
            window.removeAttachment();
            document.getElementById('emojiPicker').classList.add('hidden');

            try {
                await setDoc(docRef, { messages: updatedMessages }, { merge: true });
            } catch (err) {
                console.error("Error saving message to Firebase:", err);
            }
        };

        // Voice Message Simulation
        window.sendVoiceSim = async function() {
            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const newMsg = {
                id: Date.now(),
                senderId: currentUser.id,
                senderName: currentUser.name,
                text: '',
                time: timeNow,
                attachment: { type: 'audio', name: 'Voice Note' }
            };

            const updatedMessages = [...liveMessages, newMsg];
            const convId = getConversationDocId(currentUser.id, activeTargetUser.id);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chats', convId);

            try {
                await setDoc(docRef, { messages: updatedMessages }, { merge: true });
            } catch (err) {
                console.error("Error saving voice note to Firebase:", err);
            }
        };

        // Attachment selection handling
        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const isImg = file.type.startsWith('image/');
            currentAttachment = {
                name: file.name,
                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                type: isImg ? 'image' : 'file',
                url: isImg ? URL.createObjectURL(file) : null
            };

            const bar = document.getElementById('attachmentPreviewBar');
            document.getElementById('previewFileName').innerText = file.name;
            document.getElementById('previewFileSize').innerText = currentAttachment.size;
            document.getElementById('previewIcon').innerHTML = isImg ? '<i class="fa-solid fa-image"></i>' : '<i class="fa-solid fa-file-pdf"></i>';
            bar.classList.remove('hidden');
        };

        window.removeAttachment = function() {
            currentAttachment = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('attachmentPreviewBar').classList.add('hidden');
        };

        // Emojis & Controls
        window.toggleEmojiPicker = function() {
            document.getElementById('emojiPicker').classList.toggle('hidden');
        };

        window.insertEmoji = function(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
        };

        window.toggleChatSearch = function() {
            const bar = document.getElementById('inChatSearch');
            bar.classList.toggle('hidden');
            if (!bar.classList.contains('hidden')) {
                document.getElementById('inChatSearchInput').focus();
            } else {
                renderMessages();
            }
        };

        window.filterMessages = function(q) {
            renderMessages(q);
        };

        window.handleSearch = function(val) {
            searchFilterText = val;
            renderContactList();
        };

        window.clearCurrentChat = async function() {
            const convId = getConversationDocId(currentUser.id, activeTargetUser.id);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chats', convId);
            try {
                await setDoc(docRef, { messages: [] });
            } catch (err) {
                console.error("Error clearing chat history:", err);
            }
        };

        // Switch active logged in user profile
        window.openUserSwitchModal = function() {
            document.getElementById('userSwitchModal').classList.remove('hidden');
        };

        window.closeUserSwitchModal = function() {
            document.getElementById('userSwitchModal').classList.add('hidden');
        };

        function renderUserSwitchModalChoices() {
            const container = document.getElementById('userOptionsContainer');
            container.innerHTML = '';

            familyUsers.forEach(u => {
                const isSelected = u.id === currentUser.id;
                const html = `
                    <div onclick="switchActiveUser('${u.id}')" class="p-3 rounded-2xl border ${isSelected ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/20' : 'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/40'} flex items-center justify-between cursor-pointer transition">
                        <div class="flex items-center space-x-3">
                            <img src="${u.avatar}" class="w-10 h-10 rounded-full object-cover">
                            <div>
                                <h4 class="text-sm font-bold text-slate-900 dark:text-white">${u.name}</h4>
                                <p class="text-xs text-slate-500 dark:text-slate-400">${u.role}</p>
                            </div>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-brand-600 text-lg"></i>' : ''}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        window.switchActiveUser = function(userId) {
            const user = familyUsers.find(u => u.id === userId);
            if (!user) return;

            currentUser = user;
            updateCurrentProfileUI();
            renderUserSwitchModalChoices();

            // Auto select a different target if target is now current user
            if (activeTargetUser.id === currentUser.id) {
                const available = familyUsers.find(u => u.id !== currentUser.id);
                activeTargetUser = available;
                document.getElementById('activeName').innerText = activeTargetUser.name;
                document.getElementById('activeAvatar').src = activeTargetUser.avatar;
                document.getElementById('activeStatusText').innerText = `${activeTargetUser.role} • Online`;
            }

            renderContactList();
            subscribeToFirebaseMessages();
            closeUserSwitchModal();
        };

        function updateCurrentProfileUI() {
            document.getElementById('userAvatar').src = currentUser.avatar;
            document.getElementById('userNameDisplay').innerText = currentUser.name;
            document.getElementById('userRoleDisplay').innerText = currentUser.role;
        }

        // Call Controls
        window.triggerCall = function(type) {
            document.getElementById('callAvatar').src = activeTargetUser.avatar;
            document.getElementById('callName').innerText = activeTargetUser.name;
            document.getElementById('callStatus').innerText = `Connecting ${type} call...`;
            document.getElementById('callModal').classList.remove('hidden');
        };

        window.endCall = function() {
            document.getElementById('callModal').classList.add('hidden');
        };

        // Mobile sidebar listener
        function setupEventListeners() {
            document.getElementById('openSidebarBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
            });
            document.getElementById('closeSidebarBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            });
        }

        function setupTheme() {
            const themeBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun';
            }

            themeBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    themeIcon.className = 'fa-solid fa-sun';
                } else {
                    themeIcon.className = 'fa-solid fa-moon';
                }
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
