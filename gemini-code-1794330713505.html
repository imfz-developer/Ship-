<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Ship Family Chat - Real-Time eChat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
        .bubble-sent { border-bottom-right-radius: 2px !important; }
        .bubble-received { border-bottom-left-radius: 2px !important; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Main Container -->
    <div id="app" class="flex h-full w-full relative">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col h-full z-20 transition-all duration-300 absolute md:relative">
            
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-black text-white">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-xl shadow-md">
                        <i class="fa-solid font-bold text-lg">e</i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight text-white leading-none">Ship Ship Family Chat</h1>
                        <span class="text-xs text-slate-400 font-medium">Real-Time Firebase Chat</span>
                    </div>
                </div>
                <div class="flex items-center space-x-1">
                    <button id="themeToggle" class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Toggle Theme">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <button id="closeSidebarBtn" class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Current User Quick Profile Switcher -->
            <div class="px-4 py-3 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-white">
                <div class="flex items-center space-x-3 min-w-0">
                    <div class="relative shrink-0">
                        <img id="userAvatar" src="" class="w-9 h-9 rounded-full object-cover ring-2 ring-brand-500/30">
                        <span class="w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-900 rounded-full absolute bottom-0 right-0"></span>
                    </div>
                    <div class="min-w-0">
                        <p id="userNameDisplay" class="text-sm font-semibold leading-tight text-white truncate">Loading...</p>
                        <p id="userRoleDisplay" class="text-xs text-slate-400 truncate">Online</p>
                    </div>
                </div>
                <!-- Dropdown / Switch Account -->
                <button onclick="openUserSwitchModal()" class="text-xs bg-brand-600 hover:bg-brand-700 px-2.5 py-1.5 rounded-lg text-white font-medium transition shrink-0">
                    Switch User
                </button>
            </div>

            <!-- Inbox Search Bar -->
            <div class="p-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search contacts (Faizan, Nadeem, etc.)..." class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 border border-transparent dark:border-slate-700 transition">
                </div>
            </div>

            <!-- Contacts Inbox Header -->
            <div class="px-4 py-2 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <span>Family Inbox</span>
                <span id="syncIndicator" class="text-[10px] text-emerald-500 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Live Sync
                </span>
            </div>

            <!-- Contact List -->
            <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/50">
                <!-- Loaded Dynamically -->
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900 relative">
            
            <!-- Chat Header Bar -->
            <header id="chatHeader" class="px-4 py-3 bg-black text-white border-b border-slate-800 flex items-center justify-between z-10 shadow-md">
                <div class="flex items-center space-x-3">
                    <button id="openSidebarBtn" class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="relative">
                        <img id="activeAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                        <span id="activeStatusDot" class="w-3 h-3 bg-emerald-500 border-2 border-black rounded-full absolute bottom-0 right-0"></span>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h2 id="activeName" class="font-bold text-white leading-tight">Select a Chat</h2>
                            <span id="activeBadge" class="hidden px-2 py-0.5 text-[10px] font-semibold bg-brand-600 text-white rounded-full">Admin</span>
                        </div>
                        <p id="activeStatusText" class="text-xs text-slate-400">Online</p>
                    </div>
                </div>

                <!-- Action Items -->
                <div class="flex items-center space-x-1">
                    <button onclick="triggerCall('voice')" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Voice Call">
                        <i class="fa-solid fa-phone"></i>
                    </button>
                    <button onclick="triggerCall('video')" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Video Call">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <div class="h-5 w-px bg-slate-800 mx-1"></div>
                    <button onclick="toggleChatSearch()" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Filter Chat">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <button onclick="clearCurrentChat()" class="p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Clear Chat History">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- In-Chat Search Bar -->
            <div id="inChatSearch" class="hidden px-4 py-2 bg-indigo-50 dark:bg-slate-800 border-b border-indigo-100 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center flex-1 space-x-2">
                    <i class="fa-solid fa-filter text-brand-500 text-sm"></i>
                    <input type="text" id="inChatSearchInput" oninput="filterMessages(this.value)" placeholder="Filter messages in this conversation..." class="bg-transparent text-sm w-full focus:outline-none text-slate-800 dark:text-slate-100">
                </div>
                <button onclick="toggleChatSearch()" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-semibold px-2 py-1">Close</button>
            </div>

            <!-- Messages Stream -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Live Firestore Messages -->
            </div>

            <!-- Attachment Preview Bar -->
            <div id="attachmentPreviewBar" class="hidden px-4 py-2 bg-slate-100 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div id="previewIcon" class="w-10 h-10 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 flex items-center justify-center font-bold text-sm">
                        <i class="fa-solid fa-file"></i>
                    </div>
                    <div class="truncate">
                        <p id="previewFileName" class="text-xs font-semibold truncate text-slate-800 dark:text-slate-200">file.pdf</p>
                        <p id="previewFileSize" class="text-[10px] text-slate-500 dark:text-slate-400">1.2 MB</p>
                    </div>
                </div>
                <button onclick="removeAttachment()" class="p-1 text-slate-400 hover:text-rose-500 transition">
                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                </button>
            </div>

            <!-- Emoji Picker Popover -->
            <div id="emojiPicker" class="hidden absolute bottom-20 left-4 z-30 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl p-3 w-72">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Emojis</div>
                <div class="grid grid-cols-6 gap-2 text-xl max-h-48 overflow-y-auto p-1">
                    <button onclick="insertEmoji('😀')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😀</button>
                    <button onclick="insertEmoji('😂')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😂</button>
                    <button onclick="insertEmoji('😍')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😍</button>
                    <button onclick="insertEmoji('🔥')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🔥</button>
                    <button onclick="insertEmoji('👍')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">👍</button>
                    <button onclick="insertEmoji('🎉')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🎉</button>
                    <button onclick="insertEmoji('❤️')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">❤️</button>
                    <button onclick="insertEmoji('🚀')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🚀</button>
                    <button onclick="insertEmoji('😎')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">😎</button>
                    <button onclick="insertEmoji('🙌')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">🙌</button>
                    <button onclick="insertEmoji('💡')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">💡</button>
                    <button onclick="insertEmoji('✨')" class="hover:bg-slate-100 dark:hover:bg-slate-700 p-1 rounded transition">✨</button>
                </div>
            </div>

            <!-- Footer Message Form -->
            <footer class="p-3 sm:p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 z-10">
                <form id="messageForm" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2">
                    <label class="p-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer transition">
                        <i class="fa-solid fa-paperclip text-lg"></i>
                        <input type="file" id="fileInput" onchange="handleFileSelect(event)" class="hidden">
                    </label>
                    <button type="button" onclick="toggleEmojiPicker()" class="p-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>
                    <div class="flex-1 relative">
                        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" class="w-full py-3 pl-4 pr-10 bg-slate-100 dark:bg-slate-9
